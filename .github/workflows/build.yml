name: Build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit
      - name: Download and integrity-check pinned Inochi2D demo assets
        run: npm run prepare:inochi
      - name: Inspect Inochi2D puppet structure for original rig
        run: |
          python - <<'PY'
          import urllib.request, struct, json, pathlib
          data = urllib.request.urlopen('https://raw.githubusercontent.com/Inochi2D/inochi2d/main/examples/empty08.inx').read()
          for name,b in [('empty08',data),('aka',pathlib.Path('public/inochi2d-test/models/Aka.inx').read_bytes())]:
              print('==',name,'bytes',len(b),'header',repr(b[:24]))
              if b[:8] == b'TRNSRTS\\0':
                  n=struct.unpack('>I',b[8:12])[0]
                  j=json.loads(b[12:12+n])
                  print('root keys',list(j))
                  print('meta',str(j.get('meta'))[:700])
                  print('node template',json.dumps(j.get('nodes'),ensure_ascii=False)[:4500])
                  print('param template',json.dumps(j.get('param') or j.get('parameters'),ensure_ascii=False)[:2400])
          PY
      - name: AI protocol unit tests
        run: npm run test:ai
      - name: Typecheck and build PWA
        run: npm run build
      - name: Inochi2D real-browser WebGL2 smoke test
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mewnook-vite.log 2>&1 &
          sleep 3
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-angle=swiftshader --enable-webgl \
            --virtual-time-budget=25000 --dump-dom \
            http://127.0.0.1:4173/inochi2d-test/smoke.html \
            > /tmp/inochi-rendered.html 2> /tmp/inochi-browser.log || true
          if ! grep -q 'data-state="ready"' /tmp/inochi-rendered.html; then
            echo "::error::Inochi2D WebGL2 smoke test did not render the model"
            tail -c 1800 /tmp/inochi-rendered.html || true
            tail -n 45 /tmp/inochi-browser.log || true
            exit 1
          fi
          echo "Inochi2D WebGL2 model loaded successfully."
      - name: Commit pinned Inochi2D test assets into repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add public/inochi2d-test/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: vendor pinned Inochi2D WebGL2 demo assets and CC BY sample rig"
            git push origin HEAD:main
          fi
