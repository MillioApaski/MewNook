name: Build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit
      - name: Download and integrity-check pinned Inochi2D demo assets
        run: npm run prepare:inochi
      - name: Generate original simplified Inochi2D rig
        run: |
          python -m pip install --user pillow opencv-python-headless --quiet
          python scripts/build-mewnook-v2.py
          python scripts/check-mewnook-v2.py
          python scripts/build-mewnook-v3.py
          python scripts/check-mewnook-v3.py
      - name: Verify v4 source and native mesh rig tooling (without deploying)
        run: |
          python -m py_compile scripts/build-mewnook-v4.py scripts/upgrade-mewnook-v4.py scripts/check-mewnook-v4.py scripts/check-mewnook-v4-motion.py
          node scripts/check-inochi-v4-layout.mjs
          if [ -f assets/inochi/v4/source/pose_reference.png ]; then
            SOURCE=assets/inochi/v4/source/pose_reference.png
            echo "Using actual upright reference from GitHub."
          else
            echo "::notice::Actual upright v4 reference is still missing in GitHub. Testing code with a synthetic fixture only, NOT the intended model artwork."
            python - <<'PY'
          from PIL import Image, ImageDraw
          image=Image.new('RGBA',(1122,1402),(190,180,205,255))
          ImageDraw.Draw(image).ellipse((468,207,668,350),fill=(218,185,192,255))
          image.save('/tmp/v4-ci-synthetic.png')
          PY
            SOURCE=/tmp/v4-ci-synthetic.png
          fi
          python scripts/build-mewnook-v4.py --input "$SOURCE" --output /tmp/MewNook-v4-base.inx
          python scripts/check-mewnook-v4.py /tmp/MewNook-v4-base.inx
          python scripts/upgrade-mewnook-v4.py --source "$SOURCE" --input /tmp/MewNook-v4-base.inx --output /tmp/MewNook-v4-motion.inx --report /tmp/v4-motion-structural-report.json
          python scripts/check-mewnook-v4-motion.py /tmp/MewNook-v4-motion.inx
      - name: AI protocol unit tests
        run: npm run test:ai
      - name: Typecheck and build PWA
        run: npm run build
      - name: Inochi2D real-browser WebGL2 smoke test
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mewnook-vite.log 2>&1 &
          sleep 3
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-angle=swiftshader --enable-webgl \
            --virtual-time-budget=25000 --dump-dom \
            http://127.0.0.1:4173/inochi2d-test/smoke.html \
            > /tmp/inochi-rendered.html 2> /tmp/inochi-browser.log || true
          if ! grep -q 'data-state="ready"' /tmp/inochi-rendered.html; then
            echo "::error::Inochi2D WebGL2 smoke test did not render the model"
            grep -o 'id="status"[^<]*</span>' /tmp/inochi-rendered.html || true
            head -c 1400 /tmp/inochi-rendered.html || true
            tail -c 1800 /tmp/inochi-rendered.html || true
            tail -n 45 /tmp/inochi-browser.log || true
            exit 1
          fi
          # Virtual-time WebGL readPixels can return all zeros under SwiftShader.
          # Real blink, mouth and mesh deformation are instead asserted in the
          # Playwright screenshot test below, using regular browser frames.
          echo "Inochi2D model loaded. Pixel actions verified in Playwright."
      - name: Diagnose Inochi2D v3 render params
        run: |
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-angle=swiftshader --enable-webgl \
            --virtual-time-budget=25000 --dump-dom \
            'http://127.0.0.1:4173/inochi2d-test/smoke.html?model=v3&diagnose=1' \
            > /tmp/inochi-v3-diagnostic.html 2> /tmp/inochi-v3-browser.log || true
          python -c "import re; s=open('/tmp/inochi-v3-diagnostic.html').read(); m=re.search(r'data-diagnostic=\\\"([^\\\"]+)',s); print('V3 DIAGNOSTIC:',m.group(1) if m else 'Missing!'); print('V3 STATUS:',re.findall(r'<span id=\\\"status\\\"[^>]*>[^<]*',s)[:1])"
      - name: Diagnose v3 with real Chrome frame screenshots
        run: |
          npm install --no-save --no-audit --no-fund playwright-core pngjs pixelmatch
          node scripts/diagnose-inochi-v3.mjs
      - name: Upload v3 diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inochi-v3-probe
          path: |
            /tmp/inochi-v3-shots
            public/inochi2d-test/models/MewNook-v2.inx
            public/inochi2d-test/models/MewNook-v3.inx
          if-no-files-found: ignore
      - name: Commit pinned Inochi2D test assets into repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add public/inochi2d-test/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: vendor pinned Inochi2D WebGL2 demo assets and CC BY sample rig"
            git push origin HEAD:main
          fi
