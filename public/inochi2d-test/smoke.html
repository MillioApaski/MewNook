<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MewNook · Inochi2D 运行时检测</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#292e42;color:#f4edff}
main{max-width:1080px;margin:0 auto;padding:18px}
header{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
a{color:#b9ddff}#status{background:#404d69;padding:8px 13px;border-radius:10px}
figure{position:relative;margin:16px 0;width:min(100%,650px);height:min(72dvh,750px);min-height:360px;
border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 10%,#dfe4ff,#9cabc6 65%,#717d9d)}
canvas{display:block;width:100%;height:100%}
button{padding:10px 14px;background:#6e87b7;color:white;border:0;border-radius:9px;cursor:pointer}
button:disabled{opacity:.45}input{accent-color:#a0bde5}
#details{font-size:12px;color:#c3cce6;max-width:650px;line-height:1.7}
</style>
</head>
<body>
<main>
<header><h2>Inochi2D WebGL2 测试</h2><span id="status" data-state="loading">正在初始化…</span><a href="/">返回 MewNook</a></header>
<nav aria-label="实验模型"><a href="/inochi2d-test/smoke?model=v4">v4 正坐姿（实验）</a> · <a href="/inochi2d-test/smoke?model=v3">v3 旧斜头</a> · <a href="/inochi2d-test/smoke?model=v2">v2 对照</a></nav>
<figure><canvas id="puppet" aria-label="MewNook 原创简化 Inochi2D 模型"/></figure>
<div><button id="tap" disabled>摸头</button> <button id="idle" disabled>立即眨眼</button>
 <button id="chat" disabled>聊天表情</button> <button id="sleep" disabled>困倦表情</button> <button id="reset" disabled>恢复待机</button> <button id="closeup" disabled>脸部近看</button>
 <span id="action-label" aria-live="polite"></span>
 <label>缩放 <input id="scale" type="range" min="0.1" max="1.1" step="0.01" value="0.32"/></label></div>
<p><label>聊天台词 <input id="expression-text" value="太好了，今天的任务完成了！"/></label> <span id="expression-kind"></span></p>
<p id="details">默认展示 v4 原画实验模型：原画拆层、隐藏区及正坐姿必要补画，使用原睫毛、眉毛和补画口腔素材。可测试眨眼、聊天、困倦、摸头与复位，并切换脸部近看。独立测试使用 Inox2D（BSD-2-Clause），已接入主界面；v4 可直接点击头部测试，身体与空白不触发；可编辑源工程位于仓库 assets/inochi/v4。</p>
</main>
<script type="module">
import {sampleAction,sourceArtParameters,createActionMixer} from './actions.js?rig=source-art-20261024-retrigger'
import {chatExpression,expressionPose} from './chatExpression.js'
import {isHeadHit} from './headHitArea.js'
const node=document.querySelector('#status')
const canvas=document.querySelector('#puppet')
const setStatus=(status,text)=>{node.dataset.state=status;node.textContent=text}
let controller
try {
 if(!canvas.getContext('webgl2'))throw new Error('无 WebGL2 支持')
 const requestModel=new URLSearchParams(location.search).get('model')||'v4'
 const isV4=requestModel==='v4'
 const {createInochi2DController}=await import(isV4?'./runtime/inochi_source_bridge.js':'./runtime/inochi_bridge.js')
 controller=await createInochi2DController({wasmUrl:'/inochi2d-test/runtime/inochi2d_bg.wasm'})
 await controller.mount(canvas)
 const resize=()=>controller.resize(canvas.clientWidth,canvas.clientHeight,Math.min(devicePixelRatio||1,1.25))
 resize()
 new ResizeObserver(resize).observe(canvas)
 await controller.setCameraTransform(0,120,0.32)
 const candidateModel=requestModel!=='v2' && !isV4
 const modelUrl=isV4?'/inochi2d-test/models/MewNook-v4-review.inx?rig=source-art-20261026-focus'
   : candidateModel?'/inochi2d-test/models/MewNook-v3.inx?rig=tilted-lid-v2-20261015'
   : '/inochi2d-test/models/MewNook-v2.inx?rig=tilted-lid-v2-20261015'
 if(isV4){await controller.setCameraTransform(0,0,.46);document.querySelector('#scale').value='.46'}
 await controller.loadModel(modelUrl)
 const names=controller.getAnimationNames?.()||[]
 const probe = new URLSearchParams(location.search).has('probe')
 if(probe)window.__inochiProbe={set:async(name,value)=>controller.setParameter(name,value),
   debug:()=>controller.getDebugState?.(),
   canvas:()=>[canvas.width,canvas.height]}
 const selftest = new URLSearchParams(location.search).has('selftest')
 const diagnose = new URLSearchParams(location.search).has('diagnose')
 if(diagnose) {
   const gl=canvas.getContext('webgl2')
   const wait=(ms)=>new Promise(resolve=>setTimeout(resolve,ms))
   const take=()=>{
     const p=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4)
     gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,p)
     return p
   }
   const diff=(a,b)=>{
     let n=0,score=0
     for(let i=0;i<a.length;i+=4){
       const d=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2])
       if(d>35){n++;score+=d}
     }
     return {pixels:n,score}
   }
   const report=[]
   for(const name of ['ParamEyeBlinkLeft','ParamHairLeft','ParamHairRight','ParamHairFront','ParamTailDeform','ParamEyeDeformLeft','ParamLidCurveLeft']){
     await controller.setParameter(name,0)
     await wait(280)
     const baseline=take()
     await controller.setParameter(name,1)
     await wait(300)
     const after=take()
     const d=diff(baseline,after)
     report.push(name+'='+d.pixels+'/'+d.score)
     await controller.setParameter(name,0)
     await wait(180)
   }
   const debugState=controller.getDebugState?.()
   node.dataset.diagnostic=report.join(' | ')
   node.dataset.paramDebug=JSON.stringify({
     unresolved:debugState?.unresolvedParameterHandleIds,
     lastWritten:debugState?.lastRuntimeParameterValues,
     active:debugState?.activeAnimation
   }).slice(0,900)
   console.log('MewNook v3 per-parameter diagnostic',report,debugState)
 }

 if(selftest) {
   const gl=canvas.getContext('webgl2')
   if(!gl) throw new Error('WebGL2 context unavailable in pixel verification')
   const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms))
   const snapshot=()=>{
     const pixels=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4)
     gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,pixels)
     return pixels
   }
   await controller.setParameter?.('ParamEyeBlinkLeft',0)
   await controller.setParameter?.('ParamEyeBlinkRight',0)
   await wait(350)
   const openPixels=snapshot()
   await controller.setParameter?.('ParamEyeBlinkLeft',1)
   await controller.setParameter?.('ParamEyeBlinkRight',1)
   await wait(450)
   const closedPixels=snapshot()
   let changed=0
   for(let i=0;i<openPixels.length;i+=4) {
     const diff=Math.abs(openPixels[i]-closedPixels[i])
       +Math.abs(openPixels[i+1]-closedPixels[i+1])
       +Math.abs(openPixels[i+2]-closedPixels[i+2])
     if(diff>45) changed++
   }
   node.dataset.blinkChangedPixels=String(changed)
   if(changed<70) throw new Error('眨眼控制未造成足够的画面变化：'+changed+' pixels')
   await controller.setParameter?.('ParamEyeBlinkLeft',0)
   await controller.setParameter?.('ParamEyeBlinkRight',0)

 }
 if(names.includes('Energetic Sway'))await controller.playAnimation?.('Energetic Sway',{loop:true,kind:'idle'})
 setStatus('ready','MewNook '+(isV4?'v4 原画实验':candidateModel?'v3':'v2')+' 加载成功 · '+(selftest?'眨眼画面差异 '+node.dataset.blinkChangedPixels+' 像素':'独立眼皮及表情参数已初始化'))
 document.querySelector('#tap').disabled=false
 document.querySelector('#idle').disabled=false
 document.querySelector('#chat').disabled=false
 document.querySelector('#sleep').disabled=false
 let action='none',started=0
 const mixAction=createActionMixer()
 const announce=text=>{document.querySelector('#action-label').textContent=text}
 const apply=(name,value)=>controller.setParameter?.(name,value)
 function frame(now){
   const t=probe?0:now/1000,state=sampleAction(action,now-started)
   const expression=chatExpression(document.querySelector('#expression-text').value)
   if(action==='chat'&&!probe)Object.assign(state,expressionPose(expression))
   document.querySelector('#expression-kind').textContent=action==='chat'?expression.kind:'neutral'
   if(action!=='none'&&state.done){action='none';announce('已恢复待机')}
   const naturalBlink=!probe&&(t%4.2)<.27?Math.sin(Math.PI*(t%4.2)/.27):0
   const blink=action==='idle'||action==='tap'?state.blink:naturalBlink
   const values={
     ParamEyeBlinkLeft:blink,ParamEyeBlinkRight:blink,
     ParamBreath:Math.sin(t*2)*.65,
     ParamTailSwing:Math.sin(t*1.3)*.3,
     ParamHairLeft:Math.sin(t*.82)*.23,ParamHairRight:Math.sin(t*.73+1.1)*.20,
     ParamHairFront:Math.sin(t*1.07+.5)*.15,ParamTailDeform:Math.sin(t*.94+1.7)*.28,
     ParamEarLeft:state.earLeft,ParamEarRight:state.earRight,
     ParamHeadX:0,ParamHeadY:0,ParamSmile:action==='chat'?.65:.16,
     ParamSleepy:isV4?0:state.sleepy,
     ParamSleepyLeft:state.sleepy*(1-blink),ParamSleepyRight:state.sleepy*(1-blink),
     ParamMouthOpen:state.mouth,ParamEmbarrassed:action==='tap'?.4:0
   }
   if(isV4)Object.assign(values,sourceArtParameters(probe?state:mixAction(state,now,action==='tap'?started:0),naturalBlink,probe?0:Math.sin(t*.82)*.2),{ParamBreath:probe?0:values.ParamBreath,ParamTailDeform:probe?0:values.ParamTailDeform})
   for(const [id,value] of Object.entries(values))void apply(id,value)
   canvas.dataset.action=action
   canvas.dataset.headPatWeight=(values.ParamHeadPat??0).toFixed(3)
   canvas.dataset.eyeClosure=values.ParamEyeBlinkLeft.toFixed(3)
   return values
 }
 const ticker=probe?null:setInterval(()=>frame(performance.now()),33)
 window.addEventListener('pagehide',()=>{if(ticker)clearInterval(ticker)},{once:true})
 const startAction=(name,label)=>{action=name;started=performance.now();announce(label);frame(started)}
 for(const id of ['tap','idle','chat','sleep','reset','closeup'])document.querySelector('#'+id).disabled=false
 document.querySelector('#tap').onclick=()=>startAction('tap','摸头回应中')
 document.querySelector('#idle').onclick=()=>startAction('idle','上眼皮闭合中')
 document.querySelector('#chat').onclick=()=>startAction('chat','正在说话')
 document.querySelector('#sleep').onclick=()=>startAction('sleep',isV4?'闭眼轻憩':'困倦半睁眼')
 document.querySelector('#reset').onclick=()=>startAction('none','已恢复待机')
 if(probe)window.__inochiProbe.actionFrame=async(name,elapsed)=>{
   action=name;started=performance.now()-elapsed;return frame(performance.now())
 }
 let closeup=false
 canvas.addEventListener('click',event=>{
   if(!isV4)return
   const bounds=canvas.getBoundingClientRect()
   // Runtime camera uses backing pixels, while pointer events use CSS pixels.
   const scale=Number(document.querySelector('#scale').value)/(canvas.width/bounds.width)
   const cameraY=closeup?350:0
   const top=bounds.height/2+(cameraY-701)*scale
   if(isHeadHit(event.clientX-bounds.left,event.clientY-bounds.top,{width:bounds.width,scale,top})){
     startAction('tap','摸头回应中')
   }
 })
 document.querySelector('#closeup').onclick=()=>{closeup=!closeup;const scale=closeup?(isV4?.95:.65):(isV4?.46:.32);document.querySelector('#scale').value=String(scale);document.querySelector('#closeup').textContent=closeup?'全身查看':'脸部近看';void controller.setCameraTransform(0,isV4?(closeup?350:0):120,scale)}
 document.querySelector('#scale').oninput=e=>void controller.setCameraTransform(0,isV4?(closeup?350:0):120,Number(e.target.value))
} catch(e) {
 setStatus('error','加载失败：'+(e?.message||e))
 console.error('Inochi2D smoke test failed:',e)
}
window.addEventListener('pagehide',()=>{void controller?.unmount()},{once:true})
</script>
</body>
</html>
