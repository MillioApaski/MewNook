<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MewNook · Inochi2D 运行时检测</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#292e42;color:#f4edff}
main{max-width:1080px;margin:0 auto;padding:18px}
header{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
a{color:#b9ddff}#status{background:#404d69;padding:8px 13px;border-radius:10px}
figure{position:relative;margin:16px 0;width:min(100%,650px);height:min(72dvh,750px);min-height:360px;
border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 10%,#dfe4ff,#9cabc6 65%,#717d9d)}
canvas{display:block;width:100%;height:100%}
button{padding:10px 14px;background:#6e87b7;color:white;border:0;border-radius:9px;cursor:pointer}
button:disabled{opacity:.45}input{accent-color:#a0bde5}
#details{font-size:12px;color:#c3cce6;max-width:650px;line-height:1.7}
</style>
</head>
<body>
<main>
<header><h2>Inochi2D WebGL2 测试</h2><span id="status" data-state="loading">正在初始化…</span><a href="/">返回 MewNook</a></header>
<figure><canvas id="puppet" aria-label="MewNook 原创简化 Inochi2D 模型"/></figure>
<div><button id="tap" disabled>摸摸猫耳</button> <button id="idle" disabled>立即眨眼</button>
 <button id="chat" disabled>聊天表情</button> <button id="sleep" disabled>困倦表情</button>
 <label>缩放 <input id="scale" type="range" min="0.1" max="0.9" step="0.01" value="0.32"/></label></div>
<p id="details">MewNook 原创简化绑定测试模型，使用已有猫娘立绘制作。运行时基于 Inox2D（BSD-2-Clause）。眼睛、猫耳、尾巴可独立调整，但这还不是精细绘制和绑定完成的正式模型。</p>
</main>
<script type="module">
const node=document.querySelector('#status')
const canvas=document.querySelector('#puppet')
const setStatus=(status,text)=>{node.dataset.state=status;node.textContent=text}
let controller
try {
 if(!canvas.getContext('webgl2'))throw new Error('无 WebGL2 支持')
 const {createInochi2DController}=await import('./runtime/inochi_bridge.js')
 controller=await createInochi2DController({wasmUrl:'/inochi2d-test/runtime/inochi2d_bg.wasm'})
 await controller.mount(canvas)
 const resize=()=>controller.resize(canvas.clientWidth,canvas.clientHeight,Math.min(devicePixelRatio||1,1.25))
 resize()
 new ResizeObserver(resize).observe(canvas)
 await controller.setCameraTransform(0,120,0.32)
 const candidateModel=new URLSearchParams(location.search).get('model')==='v3'
 await controller.loadModel(candidateModel
   ? '/inochi2d-test/models/MewNook-v3.inx'
   : '/inochi2d-test/models/MewNook-v2.inx')
 const names=controller.getAnimationNames?.()||[]
 const selftest = new URLSearchParams(location.search).has('selftest')
 if(selftest) {
   const gl=canvas.getContext('webgl2')
   if(!gl) throw new Error('WebGL2 context unavailable in pixel verification')
   const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms))
   const snapshot=()=>{
     const pixels=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4)
     gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,pixels)
     return pixels
   }
   await controller.setParameter?.('ParamEyeBlinkLeft',0)
   await controller.setParameter?.('ParamEyeBlinkRight',0)
   await wait(350)
   const openPixels=snapshot()
   await controller.setParameter?.('ParamEyeBlinkLeft',1)
   await controller.setParameter?.('ParamEyeBlinkRight',1)
   await wait(450)
   const closedPixels=snapshot()
   let changed=0
   for(let i=0;i<openPixels.length;i+=4) {
     const diff=Math.abs(openPixels[i]-closedPixels[i])
       +Math.abs(openPixels[i+1]-closedPixels[i+1])
       +Math.abs(openPixels[i+2]-closedPixels[i+2])
     if(diff>45) changed++
   }
   node.dataset.blinkChangedPixels=String(changed)
   if(changed<70) throw new Error('眨眼控制未造成足够的画面变化：'+changed+' pixels')
   await controller.setParameter?.('ParamEyeBlinkLeft',0)
   await controller.setParameter?.('ParamEyeBlinkRight',0)

 }
 if(names.includes('Energetic Sway'))await controller.playAnimation?.('Energetic Sway',{loop:true,kind:'idle'})
 setStatus('ready','MewNook v2 加载成功 · '+(selftest?'眨眼画面差异 '+node.dataset.blinkChangedPixels+' 像素':'独立眼皮及表情参数已初始化'))
 document.querySelector('#tap').disabled=false
 document.querySelector('#idle').disabled=false
 document.querySelector('#chat').disabled=false
 document.querySelector('#sleep').disabled=false
 let tapUntil=0, manualBlinkUntil=0, expressionUntil=0, currentExpression='idle'
 const ticker=setInterval(()=>{
    const t=performance.now()/1000,phase=t%4.2,blink=phase<.17?Math.sin(Math.PI*phase/.17):0
    for(const [id,val] of [
      ['ParamEyeBlinkLeft',performance.now()<manualBlinkUntil?1:blink],['ParamEyeBlinkRight',performance.now()<manualBlinkUntil?1:blink],
      ['ParamBreath',Math.sin(t*2)],['ParamTailSwing',Math.sin(t*1.3)],
      ['ParamEarLeft',performance.now()<tapUntil?.9:Math.sin(t*1.8)*.4],
      ['ParamEarRight',performance.now()<tapUntil?-.9:Math.sin(t*1.7+.4)*.4],
      ['ParamHeadX',Math.sin(t*.4)*.2],
      ['ParamHeadY',Math.sin(t*.3)*.2],
      ['ParamSmile',performance.now()<expressionUntil&&currentExpression==='chat'?.8:0.1],
      ['ParamSleepy',performance.now()<expressionUntil&&currentExpression==='sleep'?.85:0],
      ['ParamMouthOpen',performance.now()<expressionUntil&&currentExpression==='chat'?Math.abs(Math.sin(t*7)):0]
    ]) void controller.setParameter?.(id,val)
 },80)
window.addEventListener('pagehide',()=>clearInterval(ticker),{once:true})
 document.querySelector('#tap').onclick=()=>{
   tapUntil=performance.now()+700
   void controller.applyInteractionImpulse?.(6,-4)
   void controller.setParameter?.('ParamEarLeft',.8)
   void controller.setParameter?.('ParamEarRight',-.8)
   if(names.includes('Yatta Celebration'))void controller.playAnimation?.('Yatta Celebration',{restart:true,kind:'reaction'})
 }
 document.querySelector('#idle').onclick=()=>{manualBlinkUntil=performance.now()+230}
 document.querySelector('#chat').onclick=()=>{currentExpression='chat';expressionUntil=performance.now()+4000}
 document.querySelector('#sleep').onclick=()=>{currentExpression='sleep';expressionUntil=performance.now()+4000}
 document.querySelector('#scale').oninput=e=>void controller.setCameraTransform(0,120,Number(e.target.value))
} catch(e) {
 setStatus('error','加载失败：'+(e?.message||e))
 console.error('Inochi2D smoke test failed:',e)
}
window.addEventListener('pagehide',()=>{void controller?.unmount()},{once:true})
</script>
</body>
</html>
